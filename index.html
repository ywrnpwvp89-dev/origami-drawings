<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6f1"><meta name="description" content="三件折纸作品的重绘折痕图与交互立体图。红色山折，蓝色谷折。"><title>折纸图纸</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><a class="brand" href="#">折纸图纸<span>ORIGAMI DRAWINGS</span></a><nav aria-label="作品"><a href="#work-02">01</a><a href="#work-01">02</a><a href="#work-03">03</a></nav><div class="legend"><span><i class="red"></i>红：山折</span><span><i class="blue"></i>蓝：谷折</span></div></header>
<main>
<section class="work" id="work-02" data-id="02"><div class="work-head"><h2><span>01</span>春之希望</h2><span class="ratio">2:1</span></div><div class="drawings"><article class="drawing crease"><div class="label">折痕图<a class="download" href="assets/crease-02.svg" download="作品二_折痕图.svg" aria-label="下载作品二折痕图">SVG ↗</a></div><button class="crease-image portrait" data-src="assets/crease-02.svg" aria-label="放大作品二折痕图"><img src="assets/crease-02.svg" alt="作品二红蓝折痕图"></button></article><article class="drawing model"><div class="label">立体图<span class="hint">拖动旋转 · 滚轮缩放</span></div><div class="canvas" id="model-02" aria-label="作品二可旋转立体图"></div><div class="progress"><span>展开</span><input type="range" min="0" max="100" value="50" aria-label="折叠进度"><span>收拢</span><output>50%</output></div><div class="views"><button data-view="iso" class="selected">轴测</button><button data-view="top">正面</button><button data-view="back">反面</button><button data-view="wire">折线</button><button data-view="reset" class="reset">复位 ↺</button></div></article></div></section>
<section class="work" id="work-01" data-id="01"><div class="work-head"><h1><span>02</span>高筒盆栽</h1><span class="ratio">2:1</span></div><div class="drawings"><article class="drawing crease"><div class="label">折痕图<a class="download" href="assets/crease-01.svg" download="作品一_折痕图.svg" aria-label="下载作品一折痕图">SVG ↗</a></div><button class="crease-image" data-src="assets/crease-01.svg" aria-label="放大作品一折痕图"><img src="assets/crease-01.svg" alt="作品一红蓝折痕图"></button></article><article class="drawing model"><div class="label">立体图<span class="hint">拖动旋转 · 滚轮缩放</span></div><div class="canvas" id="model-01" aria-label="作品一可旋转立体图"></div><div class="progress"><span>展开</span><input type="range" min="0" max="100" value="50" aria-label="折叠进度"><span>收拢</span><output>50%</output></div><div class="views"><button data-view="iso" class="selected">轴测</button><button data-view="top">正面</button><button data-view="back">反面</button><button data-view="wire">折线</button><button data-view="reset" class="reset">复位 ↺</button></div></article></div></section>
<section class="work" id="work-03" data-id="03"><div class="work-head"><h2><span>03</span>圆盆嫩芽</h2><span class="ratio">1:1</span></div><div class="drawings"><article class="drawing crease"><div class="label">折痕图<a class="download" href="assets/crease-03.svg" download="作品三_折痕图.svg" aria-label="下载作品三折痕图">SVG ↗</a></div><button class="crease-image" data-src="assets/crease-03.svg" aria-label="放大作品三折痕图"><img src="assets/crease-03.svg" alt="作品三红蓝折痕图"></button></article><article class="drawing model"><div class="label">立体图<span class="hint">拖动旋转 · 滚轮缩放</span></div><div class="canvas" id="model-03" aria-label="作品三可旋转立体图"></div><div class="progress"><span>展开</span><input type="range" min="0" max="100" value="50" aria-label="折叠进度"><span>收拢</span><output>50%</output></div><div class="views"><button data-view="iso" class="selected">轴测</button><button data-view="top">正面</button><button data-view="back">反面</button><button data-view="wire">折线</button><button data-view="reset" class="reset">复位 ↺</button></div></article></div></section>
</main><footer><span>重绘折痕 / 折叠中间态</span><span title="部分折向与隐藏层序尚待核验；作品二为照片形态重建。">春之希望为试折，折向待核</span></footer>
